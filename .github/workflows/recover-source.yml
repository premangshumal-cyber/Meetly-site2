name: Recover Meetly source from uploaded ZIP

on:
  push:
    branches:
      - repair/meetly-site2-operational
    paths:
      - .github/workflows/recover-source.yml
      - meetly.zip

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: repair/meetly-site2-operational

      - name: Verify archive and restore readable source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil, stat

          archive = Path("meetly.zip")
          if not archive.is_file():
              raise SystemExit("Missing meetly.zip")
          with ZipFile(archive) as zip_file:
              entries = [i for i in zip_file.infolist() if not i.is_dir()]
              if len(entries) > 5000 or sum(i.file_size for i in entries) > 150 * 1024 * 1024:
                  raise SystemExit("Archive exceeds safety limits")
              names = [i.filename for i in entries]
              segments = [PurePosixPath(name).parts for name in names]
              common_parent = segments[0][0] if segments and all(
                  len(p) > 1 and p[0] == segments[0][0] for p in segments
              ) else None

              print("Archive file count:", len(entries))
              print("Archive root folder:", common_parent or "(none)")
              for name in names[:200]:
                  print("ZIP:", name)

              extracted = 0
              for info in entries:
                  raw_name = info.filename
                  if (not raw_name or raw_name.startswith("/")
                      or "\\" in raw_name or ":" in raw_name
                      or any(ord(ch) < 32 for ch in raw_name)):
                      raise SystemExit("Invalid archive path")
                  parts = list(PurePosixPath(raw_name).parts)
                  if ".." in parts or "." in parts:
                      raise SystemExit("Path traversal blocked")
                  if common_parent:
                      parts = parts[1:]
                  if not parts or any(part in {
                      "__MACOSX", ".git", ".vercel", "node_modules", "__pycache__"
                  } for part in parts):
                      continue
                  if parts[-1] in {".DS_Store", "Thumbs.db"}:
                      continue
                  if parts[0] == ".github":
                      raise SystemExit("Archive may not overwrite GitHub workflows")
                  if stat.S_IFMT(info.external_attr >> 16) == stat.S_IFLNK:
                      raise SystemExit("Symlink blocked")
                  if info.flag_bits & 1:
                      raise SystemExit("Encrypted entry blocked")
                  if info.file_size > 40 * 1024 * 1024:
                      raise SystemExit("Individual file exceeds 40 MiB")
                  destination = Path(*parts)
                  if destination.exists():
                      raise SystemExit("Refusing to replace existing: " + str(destination))
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with zip_file.open(info) as source, destination.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  extracted += 1
              print("Extracted source files:", extracted)
              if extracted == 0:
                  raise SystemExit("Archive did not contain usable source")
          PY

      - name: Commit restored source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new files to commit"
          else
            git commit -m "chore: extract Meetly application sources from uploaded ZIP"
            git push origin HEAD:repair/meetly-site2-operational
          fi
